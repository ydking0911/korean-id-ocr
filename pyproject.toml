[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "idocr"
version = "0.1.0"
description = "CPU 기반 주민등록증/운전면허증 OCR worker"
requires-python = ">=3.11"
dependencies = [
    "rapidocr==3.9.2",
    "onnxruntime>=1.20,<2",
    "numpy>=1.26",
    "pillow>=10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = ["ocr: 실제 모델 파일이 필요한 테스트 (models/ 비어 있으면 skip)"]
