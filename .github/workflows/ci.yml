name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit -q

  ocr:
    name: OCR tests (real models)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Korean font for rendered smoke tests
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-nanum
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            models/*.txt
          key: models-${{ hashFiles('models/manifest.json') }}
      - name: Download and verify models
        run: python scripts/download_models.py --strict
      - run: pip install -e ".[dev]"
      # samples/ (견본 이미지)는 저장소에 없으므로 견본 테스트는 skip된다
      - run: pytest tests/ocr -q -rs

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            models/*.txt
          key: models-${{ hashFiles('models/manifest.json') }}
      - name: Download and verify models
        run: python3 scripts/download_models.py --strict
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: idocr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke test
        run: |
          docker run -d --name idocr --read-only --tmpfs /tmp:size=16m -p 127.0.0.1:8000:8000 idocr:ci
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/readyz && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/readyz
          # 이미지가 아닌 본문 → 200 + status=FAIL(IMAGE_DECODE_ERROR)
          curl -s --data-binary "not an image" -H "Content-Type: image/jpeg" http://127.0.0.1:8000/v1/ocr/id \
            | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['fail_reason']=='IMAGE_DECODE_ERROR', d"
      - name: Container logs
        if: always()
        run: docker logs idocr || true
